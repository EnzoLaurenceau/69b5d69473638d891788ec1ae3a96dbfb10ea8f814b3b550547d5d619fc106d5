[pytest]
# Un test qui `return` au lieu d'`assert` PASSE toujours : pytest ignore la valeur de
# retour. C'est ainsi que 5 tests de la Forge sont restés au vert sans rien vérifier.
# On en fait une ERREUR — le motif ne peut plus réapparaître.
filterwarnings =
    error::pytest.PytestReturnNotNoneWarning

# Suites pytest saines uniquement. Les `test_*.py` restants sont des SCRIPTS de smoke
# (effets de bord à l'import, sorties réseau) : ils cassent la collecte et ne sont pas
# des tests au sens pytest. Les convertir est un chantier à part (W5-04 suite).
