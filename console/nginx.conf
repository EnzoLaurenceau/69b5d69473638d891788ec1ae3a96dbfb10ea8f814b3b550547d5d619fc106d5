# nginx.conf — service statique de la console + proxy /v1 vers l'API (réseau interne).
#
# La console consomme EXACTEMENT le contrat /v1. En prod, elle est servie sur le même
# origin que l'API via ce proxy → pas de CORS à ouvrir côté navigateur, et le WebSocket
# /v1/stream passe par le même hôte (Upgrade géré ci-dessous).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Contrat produit : REST + WebSocket. `api` = nom du service dans docker-compose.
    location /v1/ {
        proxy_pass http://api:7777;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Upgrade WebSocket pour /v1/stream.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # Un run peut streamer longtemps : pas de coupure prématurée.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # SPA : toute route inconnue retombe sur index.html (routing par état côté React).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
