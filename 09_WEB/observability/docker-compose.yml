# Prometheus + Grafana léger pour la Forge (alternative paresseuse à Cortex).
# Scrape le /metrics du serveur FastAPI (09_WEB/server.py, port 7777).
# Lancer :  docker compose -f 09_WEB/observability/docker-compose.yml up -d
# Grafana : http://localhost:3000  (admin / forge)  — dashboard "Forge AAOS" auto-chargé
# Prometheus : http://localhost:9090
services:
  prometheus:
    image: prom/prometheus:latest
    container_name: forge-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom_data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"   # accès au serveur Forge sur l'hôte

  grafana:
    image: grafana/grafana:latest
    container_name: forge-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: forge
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  prom_data:
  grafana_data:
