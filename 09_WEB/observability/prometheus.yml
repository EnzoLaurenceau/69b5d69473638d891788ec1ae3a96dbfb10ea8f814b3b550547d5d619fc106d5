global:
  scrape_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: forge
    metrics_path: /metrics
    static_configs:
      # Sur Windows + Docker Desktop, host.docker.internal résout l'hôte
      - targets: ["host.docker.internal:7777"]
    # Timeout allongé pour éviter les premières connexions qui échouent
    scrape_interval: 15s
    scrape_timeout: 10s

  # Gateway workflows/agents (00_CORE/n8n/forge_gateway.py) — tokens in/out/
  # inference, latence p50/p95, taux d'erreur, hallucination, par workflow+agent.
  - job_name: forge_gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:7788"]
    scrape_interval: 15s
    scrape_timeout: 10s
